name: Supabase Migrations

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-migrations-production
  cancel-in-progress: false

jobs:
  apply-migrations:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate required Supabase secrets
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"

      - name: Detect config changes
        id: detect
        run: |
          BASE_SHA="${{ github.event.before }}"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "config_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$BASE_SHA" "${{ github.sha }}" | grep -Fxq "supabase/config.toml"; then
            echo "config_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "config_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate Supabase CLI
        run: npx --yes supabase login --token "$SUPABASE_ACCESS_TOKEN"

      - name: Link Supabase project
        run: npx --yes supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Preview pending migrations
        run: npx --yes supabase db push --dry-run

      - name: Apply migrations
        run: npx --yes supabase db push

      - name: Push Supabase config
        if: steps.detect.outputs.config_changed == 'true'
        run: npx --yes supabase config push
